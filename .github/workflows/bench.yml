name: Bench

on:
  push:
    branches: [proto/all-bench]
  workflow_dispatch:
    inputs:
      rounds:
        description: "Interleaved rounds per benchmark"
        default: "3"

permissions: {}

jobs:
  bench:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: proto
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: awolverp/cachebox
          ref: main
          path: base
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses]

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: "Build both and benchmark"
        shell: bash
        env:
          ROUNDS: ${{ inputs.rounds || '3' }}
        run: |
          uv run --no-project --python 3.13 python proto/.bench/run.py base proto "$ROUNDS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.os }}
          path: bench.json
